x-es-common: &es-common
  image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1

  environment:
    cluster.name: search-engine-cluster
    discovery.seed_hosts: elasticsearch-node-1,elasticsearch-node-2,elasticsearch-node-3
    cluster.initial_master_nodes: elasticsearch-node-1,elasticsearch-node-2,elasticsearch-node-3
    bootstrap.memory_lock: "true"
    xpack.security.enabled: "false"
    ES_JAVA_OPTS: "-Xms512m -Xmx512m"

  ulimits:
    memlock:
      soft: -1
      hard: -1

  networks:
    - search-net


services:

  # ---------------------------------------------------------------------
  # Elasticsearch: 3-node cluster
  # ---------------------------------------------------------------------

  elasticsearch-node-1:
    <<: *es-common

    container_name: es-node-1

    environment:
      cluster.name: search-engine-cluster
      discovery.seed_hosts: elasticsearch-node-1,elasticsearch-node-2,elasticsearch-node-3
      cluster.initial_master_nodes: elasticsearch-node-1,elasticsearch-node-2,elasticsearch-node-3
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      node.name: elasticsearch-node-1

    ports:
      - "9200:9200"

    volumes:
      - es-data-1:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 1g


  elasticsearch-node-2:
    <<: *es-common

    container_name: es-node-2

    environment:
      cluster.name: search-engine-cluster
      discovery.seed_hosts: elasticsearch-node-1,elasticsearch-node-2,elasticsearch-node-3
      cluster.initial_master_nodes: elasticsearch-node-1,elasticsearch-node-2,elasticsearch-node-3
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      node.name: elasticsearch-node-2

    volumes:
      - es-data-2:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 1g


  elasticsearch-node-3:
    <<: *es-common

    container_name: es-node-3

    environment:
      cluster.name: search-engine-cluster
      discovery.seed_hosts: elasticsearch-node-1,elasticsearch-node-2,elasticsearch-node-3
      cluster.initial_master_nodes: elasticsearch-node-1,elasticsearch-node-2,elasticsearch-node-3
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      node.name: elasticsearch-node-3

    volumes:
      - es-data-3:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 1g


  # ---------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: postgres

    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: search_engine

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search_engine"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - search-net


  # ---------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: redis

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru"
      ]

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - search-net


  # ---------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: backend

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://search:search@postgres:5432/search_engine"
      REDIS_URL: "redis://redis:6379/0"
      ELASTICSEARCH_URL: "http://elasticsearch-node-1:9200"
      ELASTICSEARCH_HOSTS: '["http://elasticsearch-node-1:9200","http://elasticsearch-node-2:9200","http://elasticsearch-node-3:9200"]'

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      elasticsearch-node-1:
        condition: service_healthy

    networks:
      - search-net

    restart: unless-stopped


  # ---------------------------------------------------------------------
  # Async indexing worker
  # ---------------------------------------------------------------------

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker

    container_name: worker

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://search:search@postgres:5432/search_engine"
      REDIS_URL: "redis://redis:6379/0"
      ELASTICSEARCH_URL: "http://elasticsearch-node-1:9200"
      ELASTICSEARCH_HOSTS: '["http://elasticsearch-node-1:9200","http://elasticsearch-node-2:9200","http://elasticsearch-node-3:9200"]'

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      elasticsearch-node-1:
        condition: service_healthy

    networks:
      - search-net

    restart: unless-stopped

    deploy:
      replicas: 1


  # ---------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: "http://localhost:8000/api/v1"

    container_name: frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - search-net

    restart: unless-stopped

    # FIX:
    # Use 127.0.0.1 instead of localhost for the nginx healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ---------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    networks:
      - search-net

    depends_on:
      - backend


# -----------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------

networks:
  search-net:
    driver: bridge


# -----------------------------------------------------------------------
# Persistent volumes
# -----------------------------------------------------------------------

volumes:
  es-data-1:
  es-data-2:
  es-data-3:
  postgres-data:
  redis-data: